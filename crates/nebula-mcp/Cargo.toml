[package]
name = "nebula-mcp"
version.workspace = true
edition.workspace = true

# Deliberately no `nebula-control`, no `nebula-runtime`, no `wasmtime`. This is
# a protocol adapter that faces the open internet, and it reaches the cluster
# the same way any other client does: over the HTTP gateway of §11.1. The one
# thing it borrows from the control plane is two header *names*, and a dev
# dependency proves they still match without a production coupling.
[dependencies]
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
nebula-control.workspace = true
