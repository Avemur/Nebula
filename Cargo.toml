[workspace]
resolver = "2"
members = [
    "crates/nebula-control",
    "crates/nebula-proto",
    "crates/nebula-runtime",
    "crates/nebula-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Optimize dependencies even in dev builds. wasmtime does the store creation,
# instantiation, and WASI context setup on every execution; unoptimized that
# costs milliseconds and swamps any latency measurement. Our own crates stay at
# opt-level 0 so they remain quick to compile and debuggable.
[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
# README.md R3: pin one exact version, do not upgrade mid-phase.
wasmtime = "48"
wasmtime-wasi = "48"
dashmap = "6"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# tonic 0.14 split prost codegen out of `tonic-build`; `tonic-prost-build` is
# the build-time half and `tonic-prost` the runtime half.
tonic = "0.14"
axum = "0.8"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"

# tonic re-exports `tokio_stream` through `tonic::codegen`, so there is no
# direct dependency on it here — and no chance of a version skew against the
# one the generated code uses.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

nebula-control = { path = "crates/nebula-control" }
nebula-proto = { path = "crates/nebula-proto" }
nebula-runtime = { path = "crates/nebula-runtime" }
